[build]
  command = "bash scripts/netlify-build.sh"
  publish = "dist"
  # ricostruisce solo il progetto il cui codice è cambiato (risparmia crediti)
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/originali/*"
  [headers.values]
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=31536000, immutable"
